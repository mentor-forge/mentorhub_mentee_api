      security:
        - bearerAuth: []
      parameters:
        - name: PathId
          in: path
          required: true
          description: The Path ID (MongoDB ObjectId)
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Successfully retrieved Path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Path'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT issued by your identity provider (Developer Edition welcome flow for local dev).
        Include the token in the Authorization header: `Bearer <token>`

  parameters:
    ObjectId:
      name: controlId
      in: path
      required: true
      description: MongoDB ObjectId
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
        example: 507f1f77bcf86cd799439011

  responses:
    BadRequest:
      description: Bad Request - Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized - Invalid or missing token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
          example: Unauthorized

    Breadcrumb:
      type: object
      description: Audit trail information
      additionalProperties: false
      required:
        - from_ip
        - by_user
        - at_time
        - correlation_id
      properties:
        from_ip:
          type: string
          format: ip
          description: HTTP request remote IP address
          example: 192.168.1.1
        at_time:
          type: string
          format: date-time
          description: Timestamp of the action
          example: "2024-01-15T10:00:00Z"
        by_user:
          type: string
          description: User ID who performed the action
          pattern: '^[^\s]{1,40}$'
          example: user-123
        correlation_id:
          type: string
          description: Logging correlation ID
          pattern: '^[^\s]{1,40}$'
          example: corr-abc123

    Journey:
      type: object
      description: Journey domain document
      additionalProperties: false
      required:
        - _id
        - name
        - created
        - saved
      properties:
        _id:
          type: string
          description: MongoDB document ID
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011
        name:
          type: string
          description: Journey name
          pattern: '^[^\s]{1,40}$'
          example: my-Journey
        description:
          type: string
          description: Journey description
          pattern: '^[^\t\n]{0,255}$'
          example: A sample Journey document
        status:
          type: string
          description: Journey status
          enum:
            - active
            - archived
          example: active
        created:
          $ref: '#/components/schemas/Breadcrumb'
        saved:
          $ref: '#/components/schemas/Breadcrumb'

    JourneyInput:
      type: object
      description: Input for creating a Journey document
      properties:
        name:
          type: string
          description: Journey name
          pattern: '^[^\s]{1,40}$'
          example: my-Journey
        description:
          type: string
          description: Journey description
          pattern: '^[^\t\n]{0,255}$'
          example: A sample Journey document
        status:
          type: string
          description: Journey status
          enum:
            - active
            - archived
          example: active

    JourneyUpdate:
      type: object
      description: Fields to update in a Journey document (cannot include _id, created, saved)
      properties:
        name:
          type: string
          description: Journey name
          pattern: '^[^\s]{1,40}$'
        description:
          type: string
          description: Journey description
          pattern: '^[^\t\n]{0,255}$'
        status:
          type: string
          description: Journey status
          enum:
            - active
            - archived
    Rating:
      type: object
      description: Rating domain document
      additionalProperties: false
      required:
        - _id
        - name
        - created
        - saved
      properties:
        _id:
          type: string
          description: MongoDB document ID
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011
        name:
          type: string
          description: Rating name
          pattern: '^[^\s]{1,40}$'
          example: my-Rating
        description:
          type: string
          description: Rating description
          pattern: '^[^\t\n]{0,255}$'
          example: A sample Rating document
        status:
          type: string
          description: Rating status
          enum:
            - active
            - archived
          example: active
        created:
          $ref: '#/components/schemas/Breadcrumb'
        saved:
          $ref: '#/components/schemas/Breadcrumb'

    RatingInput:
      type: object
      description: Input for creating a Rating document
      properties:
        name:
          type: string
          description: Rating name
          pattern: '^[^\s]{1,40}$'
          example: my-Rating
        description:
          type: string
          description: Rating description
          pattern: '^[^\t\n]{0,255}$'
          example: A sample Rating document
        status:
          type: string
          description: Rating status
          enum:
            - active
            - archived
          example: active

    RatingUpdate:
      type: object
      description: Fields to update in a Rating document (cannot include _id, created, saved)
      properties:
        name:
          type: string
          description: Rating name
          pattern: '^[^\s]{1,40}$'
        description:
          type: string
          description: Rating description
          pattern: '^[^\t\n]{0,255}$'
        status:
          type: string
          description: Rating status
          enum:
            - active
            - archived
    Note:
      type: object
      description: Note domain document
      additionalProperties: false
      required:
        - _id
        - name
        - created
        - saved
      properties:
        _id:
          type: string
          description: MongoDB document ID
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011
        name:
          type: string
          description: Note name
          pattern: '^[^\s]{1,40}$'
          example: my-Note
        description:
          type: string
          description: Note description
          pattern: '^[^\t\n]{0,255}$'
          example: A sample Note document
        status:
          type: string
          description: Note status
          enum:
            - active
            - archived
          example: active
        created:
          $ref: '#/components/schemas/Breadcrumb'
        saved:
          $ref: '#/components/schemas/Breadcrumb'

    NoteInput:
      type: object
      description: Input for creating a Note document
      properties:
        name:
          type: string
          description: Note name
          pattern: '^[^\s]{1,40}$'
          example: my-Note
        description:
          type: string
          description: Note description
          pattern: '^[^\t\n]{0,255}$'
          example: A sample Note document
        status:
          type: string
          description: Note status
          enum:
            - active
            - archived
          example: active

    NoteUpdate:
      type: object
      description: Fields to update in a Note document (cannot include _id, created, saved)
      properties:
        name:
          type: string
          description: Note name
          pattern: '^[^\s]{1,40}$'
        description:
          type: string
          description: Note description
          pattern: '^[^\t\n]{0,255}$'
        status:
          type: string
          description: Note status
          enum:
            - active
            - archived
    Event:
      type: object
      description: Event domain document
      additionalProperties: false
      required:
        - _id
        - name
        - created
      properties:
        _id:
          type: string
          description: MongoDB document ID
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011
        name:
          type: string
          description: Event name
          pattern: '^[^\s]{1,40}$'
          example: my-Event
        description:
          type: string
          description: Event description
          pattern: '^[^\t\n]{0,255}$'
          example: A sample Event document
        status:
          type: string
          description: Event status
          example: active
        created:
          $ref: '#/components/schemas/Breadcrumb'

    EventInput:
      type: object
      description: Input for creating a Event document
      properties:
        name:
          type: string
          description: Event name
          pattern: '^[^\s]{1,40}$'
          example: my-Event
        description:
          type: string
          description: Event description
          pattern: '^[^\t\n]{0,255}$'
          example: A sample Event document
        status:
          type: string
          description: Event status
          example: active
    Resource:
      type: object
      description: A learning resource (link) (read-only)
      additionalProperties: false
      properties:
        _id:
          type: string
          description: The unique identifier for the Resource
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011
        name:
          type: string
          description: The searchable name of the document
          pattern: '^[^\s]{1,40}$'
          example: my-Resource
        description:
          type: string
          description: The description of the Resource
          pattern: '^[^\t\n]{0,255}$'
          example: A sample Resource document
        url:
          type: string
          description: The link for the resource
          format: uri
          example: https://example.com/resource
        type:
          type: string
          description: What type of resource
          enum:
            - article
            - audio
            - book
            - getting-started
            - in-person
            - lesson
            - manual
            - membership
            - online-class
            - online-instructor
            - tutorial
            - video
          example: article
        cost:
          type: string
          description: The cost to use this resource
          enum:
            - $
            - $$
            - $$$
            - S$
            - S$$
            - S$$$
            - free
          example: free
        skill_level:
          type: string
          description: The skill level
          enum:
            - Candidate
            - Apprentice
            - Practioneer
            - Craftsperson
            - Master
            - Distinguished
          example: Apprentice
        interests:
          type: array
          description: A list of interests this resource is related to
          items:
            type: string
            enum:
              - ux
              - api
              - sre
              - data
              - design
              - games
              - iot
              - robot
        technologies:
          type: array
          description: A list of technologies this resource covers
          items:
            type: string
            enum:
              - React
              - MongoDB
              - Python
              - TypeScript
              - Java
              - HTML
              - CSS
              - Other
        last_verified:
          type: string
          format: date-time
          description: When was this resource link last verified
          example: "2024-01-15T10:00:00Z"
        status:
          type: string
          description: Status of the document
          enum:
            - active
            - archived
            - failed
          example: active
        created:
          $ref: '#/components/schemas/Breadcrumb'
        saved:
          $ref: '#/components/schemas/Breadcrumb'

    ResourceAggregation:
      type: object
      description: Resource level rating and note count metrics
      additionalProperties: false
      required:
        - _id
        - resource_id
        - rating_sum
        - created
        - last_saved
      properties:
        _id:
          type: string
          description: A unique identifier for Resource_Aggregation
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011
        resource_id:
          type: string
          description: The Resource that is rated
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011
        note_count:
          type: integer
          minimum: 0
          description: The number of notes left on this resource
          example: 3
        completions:
          type: integer
          minimum: 0
          description: The number of times this resource has been completed
          example: 5
        hits:
          type: integer
          minimum: 0
          description: The number of times this URL has been clicked
          example: 12
        duration:
          type: string
          description: The total duration of all completions (ISO 8601 duration)
          pattern: '^P(?!$)(\d+Y)?(\d+M)?(\d+W)?(\d+D)?(T(\d+H)?(\d+M)?(\d+(\.\d+)?S)?)?$'
          example: PT2H30M
        rating_count:
          type: integer
          minimum: 0
          description: The number of ratings (should equal completions)
          example: 5
        rating_sum:
          type: integer
          minimum: 0
          description: The sum of all ratings
          example: 20
        created:
          $ref: '#/components/schemas/Breadcrumb'
        last_saved:
          $ref: '#/components/schemas/Breadcrumb'

    ResourceDetail:
      type: object
      description: Composite Resource detail view (resource + aggregation + notes)
      additionalProperties: false
      required:
        - resource
        - notes
      properties:
        resource:
          $ref: '#/components/schemas/Resource'
        aggregation:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ResourceAggregation'
        notes:
          type: array
          description: Notes related to this resource
          items:
            $ref: '#/components/schemas/Note'
    Path:
      type: object
      description: Path domain document (read-only)
      additionalProperties: false
      required:
        - _id
        - name
      properties:
        _id:
          type: string
          description: MongoDB document ID
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011
        name:
          type: string
          description: Path name
          pattern: '^[^\s]{1,40}$'
          example: my-Path
        description:
          type: string
          description: Path description
          pattern: '^[^\t\n]{0,255}$'
          example: A sample Path document
        status:
          type: string
          description: Path status
          example: active
    InfiniteScrollResponse:
      type: object
      description: Infinite scroll pagination response
      required:
        - items
        - limit
        - has_more
        - next_cursor
      properties:
        items:
          type: array
          description: Array of resource documents
          items: {}
        limit:
          type: integer
          description: Items per batch
          example: 10
        has_more:
          type: boolean
          description: Whether there are more items available
          example: true
        next_cursor:
          type: string
          nullable: true
          description: ID of last item for next request (null if no more items)
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011