openapi: 3.0.3
info:
  title: Mentor Hub mentee API
  description: |
    A Flask + MongoDB API for the mentee service.
    
    ## Authentication
    All endpoints (except `/metrics`) require JWT authentication via the `Authorization` header:
    ```
    Authorization: Bearer <token>
    ```
    
    For local development, obtain a JWT from the Developer Edition welcome / IdP flow, or use a
    test token from `test/e2e/e2e_auth.py` that matches your `JWT_SECRET` and expected claims.
  version: 0.1.0
  contact:
    name: Mentor Forge
    email: info@agile-learning-institute.com
  license:
    name: Apache-2.0

servers:
  - url: http://localhost:8393
    description: Local development server

tags:
  - name: Config
    description: Configuration endpoints
  - name: Metrics
    description: Monitoring endpoints
  - name: Journey
    description: |
      Token-scoped Journey read (get-or-create), ownership RBAC on PATCH, and
      server-managed advance/complete mutations that record Events.
  - name: Note
    description: Note operations (create only)
  - name: Event
    description: Event operations (create only; context populated server-side from JWT token)
  - name: Aggregation
    description: Resource aggregation metrics and related notes (read)
  - name: Resource
    description: Resource operations (read-only)
  - name: Path
    description: Path operations (read-only)
paths:
  /api/config:
    get:
      tags:
        - Config
      summary: Get configuration
      description: Returns the current configuration as JSON (requires authentication)
      operationId: getConfig
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Configuration retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  config_items:
                    type: array
                    items:
                      type: object
                  versions:
                    type: array
                    items:
                      type: object
                  enumerators:
                    type: array
                    items:
                      type: object
                  token:
                    type: object
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /metrics:
    get:
      tags:
        - Metrics
      summary: Prometheus metrics
      description: Returns Prometheus-formatted metrics
      operationId: getMetrics
      responses:
        '200':
          description: Metrics retrieved successfully
          content:
            text/plain:
              schema:
                type: string

  /api/journey:
    get:
      tags:
        - Journey
      summary: Get authenticated user's Journey
      description: |
        Return the Journey for the authenticated user. The server resolves the document
        using `profile_id` from the JWT. When no Journey exists, the server clones the
        template Journey (`ffff00000000000000000001`), sets `_id` and `profile_id` to
        the token's `profile_id`, and returns the new document.
      operationId: getMyJourney
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successfully retrieved Journey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Template Journey not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/journey/advance/{resource_id}:
    patch:
      tags:
        - Journey
      summary: Advance a resource from next to now
      description: |
        Move a resource from the Journey `next` scope into `now` by Resource ID.
        Creates an `advanced` Event server-side (context populated from the JWT).
      operationId: advanceJourneyResource
      security:
        - bearerAuth: []
      parameters:
        - name: resource_id
          in: path
          required: true
          description: The Resource ID (MongoDB ObjectId)
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Journey updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/journey/complete/{resource_id}:
    patch:
      tags:
        - Journey
      summary: Complete a resource in now
      description: |
        Record completion of a resource in `now` — move it to `library`, update
        Resource_Aggregation counters, and create a `completed` Event server-side.
      operationId: completeJourneyResource
      security:
        - bearerAuth: []
      parameters:
        - name: resource_id
          in: path
          required: true
          description: The Resource ID (MongoDB ObjectId)
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JourneyCompleteInput'
      responses:
        '200':
          description: Journey updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/journey/{journey_id}:
    patch:
      tags:
        - Journey
      summary: Update Journey document
      description: |
        Update a Journey document. Requires ownership (`journey_id` equals token
        `profile_id`) or `admin` in token `roles`. Cannot update `_id`, `profile_id`,
        `created`, `saved`, `library`, `now`, or `next` — those are server-managed.
      operationId: updateJourney
      security:
        - bearerAuth: []
      parameters:
        - name: journey_id
          in: path
          required: true
          description: The Journey ID (MongoDB ObjectId)
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JourneyUpdate'
      responses:
        '200':
          description: Journey updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/note:
    post:
      tags:
        - Note
      summary: Create a new Note document
      description: Create a note about a resource. Requires a valid JWT.
      operationId: createNote
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteInput'
      responses:
        '201':
          description: Note created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/event:
    post:
      tags:
        - Event
      summary: Create a new Event document
      description: |
        Record a meaningful system event. Requires a valid JWT.

        The client sends only `type`. The server populates `context` from all JWT token
        properties returned by `create_flask_token` (e.g. `user_id`, `name`, `roles`,
        `profile_id`, `customer_id`, `mentor_id`, `remote_ip`). Clients do not send
        context fields.
      operationId: createEvent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '201':
          description: Event created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/aggregation/{resource_id}:
    get:
      tags:
        - Aggregation
      summary: Get Resource aggregation detail by resource ID
      description: |
        Retrieve Resource_Aggregation metrics and related Notes for a resource.
        When no aggregation document exists for the resource, one is created with zeroed counters.
        Any authenticated token holder may read.
      operationId: getAggregationDetail
      security:
        - bearerAuth: []
      parameters:
        - name: resource_id
          in: path
          required: true
          description: The Resource ID (MongoDB ObjectId)
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Successfully retrieved aggregation detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregationDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/resource:
    get:
      tags:
        - Resource
      summary: Get all Resource documents
      description: |
        Retrieve a paginated array of Resource documents (read-only).

        Pagination is controlled by request headers:
        - `offset` — zero-based start index (default `0`)
        - `size` — page size (default `20`, maximum `100`)

        Optional query filters (multiple filters are ANDed):
        - `name` — case-insensitive substring match on `name`
        - `description` — case-insensitive substring match on `description`
        - `status` — comma-separated values matched with `$in` (e.g. `active,draft`)
        - `url` — case-insensitive substring match on `url`
        - `interests` — comma-separated values matched with `$in` on the `interests` array (any-element match)
        - `technologies` — comma-separated values matched with `$in` on the `technologies` array
        - `skill_level` — comma-separated values matched with `$in` on `skill_level`

        Optional sort query params:
        - `sort_by` — whitelisted field (`name`, `description`, `status`, `created.at_time`, `saved.at_time`; default `name`)
        - `order` — `asc` or `desc` (default `asc`)

        Non-`admin` callers receive only resources whose `status` is not `archived`.
        Users with the `admin` role may see all resources, including `archived`.
      operationId: getResources
      security:
        - bearerAuth: []
      parameters:
        - name: offset
          in: header
          required: false
          description: Zero-based index of the first resource to return
          schema:
            type: integer
            minimum: 0
            default: 0
            example: 0
        - name: size
          in: header
          required: false
          description: Number of resources to return (max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
        - name: name
          in: query
          required: false
          description: Case-insensitive substring filter on resource name
          schema:
            type: string
            example: onboarding
        - name: description
          in: query
          required: false
          description: Case-insensitive substring filter on resource description
          schema:
            type: string
            example: guide
        - name: status
          in: query
          required: false
          description: Comma-separated status values (e.g. active,draft)
          schema:
            type: string
            example: active
        - name: url
          in: query
          required: false
          description: Case-insensitive substring filter on resource url
          schema:
            type: string
            example: github.com
        - name: interests
          in: query
          required: false
          description: Comma-separated interest values matched with $in on the interests array (e.g. api,sre)
          schema:
            type: string
            example: api
        - name: technologies
          in: query
          required: false
          description: Comma-separated technology values matched with $in on the technologies array (e.g. Python,React)
          schema:
            type: string
            example: Python
        - name: skill_level
          in: query
          required: false
          description: Comma-separated skill_level values (e.g. Apprentice,Craftsperson)
          schema:
            type: string
            example: Apprentice
        - name: sort_by
          in: query
          required: false
          description: Field to sort by (name, description, status, created.at_time, saved.at_time)
          schema:
            type: string
            default: name
            example: name
        - name: order
          in: query
          required: false
          description: Sort order
          schema:
            type: string
            enum: [asc, desc]
            default: asc
            example: asc
      responses:
        '200':
          description: Successfully retrieved Resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Resource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/path:
    get:
      tags:
        - Path
      summary: Get Path documents
      description: |
        Retrieve a paginated array of Path documents (read-only).

        Pagination is controlled by request headers:
        - `offset` — zero-based start index (default `0`)
        - `size` — page size (default `20`, maximum `100`)

        Optional query filters:
        - `name` — case-insensitive substring match on `name`

        Optional sort query params:
        - `sort_by` — whitelisted field (`name`; default `name`)
        - `order` — `asc` or `desc` (default `asc`)

        Returns a plain JSON array (one page). Clients needing the full collection must iterate with `offset`/`size` headers.
      operationId: getPaths
      security:
        - bearerAuth: []
      parameters:
        - name: offset
          in: header
          required: false
          description: Zero-based index of the first path to return
          schema:
            type: integer
            minimum: 0
            default: 0
            example: 0
        - name: size
          in: header
          required: false
          description: Number of paths to return (max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
        - name: name
          in: query
          required: false
          description: Case-insensitive substring filter on path name
          schema:
            type: string
            example: onboarding
        - name: sort_by
          in: query
          required: false
          description: Field to sort by (name)
          schema:
            type: string
            default: name
            example: name
        - name: order
          in: query
          required: false
          description: Sort order
          schema:
            type: string
            enum: [asc, desc]
            default: asc
            example: asc
      responses:
        '200':
          description: Successfully retrieved Paths
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Path'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/resource/{resource_id}:
    get:
      tags:
        - Resource
      summary: Get Resource detail by ID
      description: |
        Retrieve a Resource detail composite (read-only): the Resource document,
        its Resource_Aggregation metrics (or `null` when none exists), and related Notes.
      operationId: getResource
      security:
        - bearerAuth: []
      parameters:
        - name: resource_id
          in: path
          required: true
          description: The Resource ID (MongoDB ObjectId)
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Successfully retrieved Resource detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/path/{path_id}:
    get:
      tags:
        - Path
      summary: Get Path by ID
      description: |
        Retrieve a specific Path document by ID (read-only).

        Nested `modules[].topics[].resources[]` entries include minimal Resource
        data (`_id`, `name`, `description`) in addition to the identifier.
      operationId: getPath
      security:
        - bearerAuth: []
      parameters:
        - name: path_id
          in: path
          required: true
          description: The Path ID (MongoDB ObjectId)
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Successfully retrieved Path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT issued by your identity provider (Developer Edition welcome flow for local dev).
        Include the token in the Authorization header: `Bearer <token>`

  parameters:
    ObjectId:
      name: controlId
      in: path
      required: true
      description: MongoDB ObjectId
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
        example: 507f1f77bcf86cd799439011

  responses:
    BadRequest:
      description: Bad Request - Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized - Invalid or missing token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
          example: Unauthorized

    Breadcrumb:
      type: object
      description: Audit trail information
      additionalProperties: false
      required:
        - from_ip
        - by_user
        - at_time
        - correlation_id
      properties:
        from_ip:
          type: string
          format: ip
          description: HTTP request remote IP address
          example: 192.168.1.1
        at_time:
          type: string
          format: date-time
          description: Timestamp of the action
          example: "2024-01-15T10:00:00Z"
        by_user:
          type: string
          description: User ID who performed the action
          pattern: '^[^\s]{1,40}$'
          example: user-123
        correlation_id:
          type: string
          description: Logging correlation ID
          pattern: '^[^\s]{1,40}$'
          example: corr-abc123

    Journey:
      type: object
      description: A learning journey for a craftsperson
      additionalProperties: false
      required:
        - _id
        - created
        - saved
      properties:
        _id:
          type: string
          description: The unique identifier for the Learning Journey
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011
        profile_id:
          type: string
          description: The Profile ID of the owner of this journey
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011
        status:
          type: string
          description: Status of the document
          enum:
            - active
            - archived
          example: active
        library:
          type: array
          description: Completed resources
          items:
            $ref: '#/components/schemas/JourneyLibraryItem'
        now:
          type: array
          description: Resources the person is currently working on
          items:
            $ref: '#/components/schemas/JourneyNowItem'
        next:
          type: array
          description: Modules the mentee will work on next
          items:
            $ref: '#/components/schemas/JourneyNextModule'
        later:
          type: array
          description: Path IDs the mentee might work on someday
          items:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
        created:
          $ref: '#/components/schemas/Breadcrumb'
        saved:
          $ref: '#/components/schemas/Breadcrumb'

    JourneyLibraryItem:
      type: object
      description: A completed resource in the Journey library
      additionalProperties: false
      properties:
        resource_id:
          type: string
          description: The Resource ID
          pattern: '^[0-9a-fA-F]{24}$'
        started:
          type: string
          format: date-time
          description: The first time the user followed the resource link
        completed:
          type: string
          format: date-time
          description: When the user marked the resource complete
        used:
          type: integer
          minimum: 0
          description: The count of times the link has been followed
        rating:
          type: integer
          minimum: 1
          maximum: 4
          description: The mentee's star rating for this completed resource

    JourneyNowItem:
      type: object
      description: An in-progress resource in the Journey now scope
      additionalProperties: false
      properties:
        resource_id:
          type: string
          description: The Resource ID
          pattern: '^[0-9a-fA-F]{24}$'
        added:
          type: string
          format: date-time
          description: When the resource was added to the Now scope
        started:
          type: string
          format: date-time
          description: The first time the link was followed
        used:
          type: integer
          minimum: 0
          description: The count of times the link was followed

    JourneyNextTopic:
      type: object
      description: A topic within a Journey next module
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: '^[^\s]{1,40}$'
        description:
          type: string
          pattern: '^[^\t\n]{0,255}$'
        resources:
          type: array
          description: Resource IDs for this topic
          items:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'

    JourneyNextModule:
      type: object
      description: A module in the Journey next scope
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: '^[^\s]{1,40}$'
        description:
          type: string
          pattern: '^[^\t\n]{0,255}$'
        topics:
          type: array
          items:
            $ref: '#/components/schemas/JourneyNextTopic'

    JourneyUpdate:
      type: object
      description: |
        Fields to update in a Journey document. Cannot include _id, profile_id,
        created, saved, library, now, or next.
      additionalProperties: false
      properties:
        status:
          type: string
          description: Journey status
          enum:
            - active
            - archived
        later:
          type: array
          description: Path IDs the mentee might work on someday
          items:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'

    JourneyCompleteInput:
      type: object
      description: Optional input when completing a resource in now
      additionalProperties: false
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 4
          description: Star rating for the completed resource
        note:
          type: string
          maxLength: 4096
          description: Optional note about the resource
        duration:
          type: string
          description: Time spent on the resource (ISO 8601 duration)
          pattern: '^P(?!$)(\d+Y)?(\d+M)?(\d+W)?(\d+D)?(T(\d+H)?(\d+M)?(\d+(\.\d+)?S)?)?$'
          example: PT1H30M
    Note:
      type: object
      description: A note about a resource
      additionalProperties: false
      properties:
        _id:
          type: string
          description: The unique identifier for the Note
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011
        resource_id:
          type: string
          description: The Resource ID this note is for
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011
        profile_id:
          type: string
          description: The Profile ID of the person who took this note
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011
        note:
          type: string
          description: The text of the note
          maxLength: 4096
          example: Found this resource very helpful for learning async patterns.
        status:
          type: string
          description: Status of the document
          enum:
            - active
            - archived
          example: active
        created:
          $ref: '#/components/schemas/Breadcrumb'
        saved:
          $ref: '#/components/schemas/Breadcrumb'

    NoteInput:
      type: object
      description: Input for creating a Note document
      additionalProperties: false
      properties:
        resource_id:
          type: string
          description: The Resource ID this note is for
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011
        profile_id:
          type: string
          description: The Profile ID of the person who took this note
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011
        note:
          type: string
          description: The text of the note
          maxLength: 4096
          example: Found this resource very helpful for learning async patterns.
        status:
          type: string
          description: Status of the document
          enum:
            - active
            - archived
          example: active

    Event:
      type: object
      description: A meaningful event in the system
      additionalProperties: false
      properties:
        _id:
          type: string
          description: The unique identifier for the Event
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011
        type:
          type: string
          description: The event type
          enum:
            - advanced
            - arrived
            - completed
            - encounter
            - fail
            - link
            - login
            - logout
            - note
            - started
          example: link
        context:
          type: object
          description: |
            Event context populated server-side from the authenticated JWT token (all token
            properties). Not supplied by the client. Additional properties allowed for
            forward-compatible token claim expansion.
          additionalProperties: true
          properties:
            user_id:
              type: string
              description: IdP user identifier from the JWT (`sub`)
              example: auth0|507f1f77bcf86cd799439011
            name:
              type: string
              description: Display name from the JWT
              example: Jane Mentee
            roles:
              type: array
              description: Roles from the JWT
              items:
                type: string
              example: [mentee]
            profile_id:
              type: string
              description: Profile associated with the event
              pattern: '^[0-9a-fA-F]{24}$'
              example: 507f1f77bcf86cd799439011
            customer_id:
              type: string
              description: Customer identifier from the JWT
              pattern: '^[0-9a-fA-F]{24}$'
              example: 507f1f77bcf86cd799439012
            mentor_id:
              type: string
              description: Mentor identifier from the JWT
              pattern: '^[0-9a-fA-F]{24}$'
              example: 507f1f77bcf86cd799439013
            remote_ip:
              type: string
              description: HTTP request remote IP from the token
              format: ip
              example: 192.168.1.1
            resource_id:
              type: string
              description: Resource identifier when present on the token
              pattern: '^[0-9a-fA-F]{24}$'
              example: 507f1f77bcf86cd799439014
            journey_id:
              type: string
              description: Journey identifier when present on the token
              pattern: '^[0-9a-fA-F]{24}$'
              example: 507f1f77bcf86cd799439015
        created:
          $ref: '#/components/schemas/Breadcrumb'

    EventInput:
      type: object
      description: |
        Input for creating an Event document. Only `type` is required; `context` is
        populated server-side from the JWT token.
      additionalProperties: false
      required:
        - type
      properties:
        type:
          type: string
          description: The event type
          enum:
            - advanced
            - arrived
            - completed
            - encounter
            - fail
            - link
            - login
            - logout
            - note
            - started
          example: link
    Resource:
      type: object
      description: A learning resource (link) (read-only)
      additionalProperties: false
      properties:
        _id:
          type: string
          description: The unique identifier for the Resource
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011
        name:
          type: string
          description: The searchable name of the document
          pattern: '^[^\s]{1,40}$'
          example: my-Resource
        description:
          type: string
          description: The description of the Resource
          pattern: '^[^\t\n]{0,255}$'
          example: A sample Resource document
        url:
          type: string
          description: The link for the resource
          format: uri
          example: https://example.com/resource
        type:
          type: string
          description: What type of resource
          enum:
            - article
            - audio
            - book
            - getting-started
            - in-person
            - lesson
            - manual
            - membership
            - online-class
            - online-instructor
            - tutorial
            - video
          example: article
        cost:
          type: string
          description: The cost to use this resource
          enum:
            - $
            - $$
            - $$$
            - S$
            - S$$
            - S$$$
            - free
          example: free
        skill_level:
          type: string
          description: The skill level
          enum:
            - Candidate
            - Apprentice
            - Practioneer
            - Craftsperson
            - Master
            - Distinguished
          example: Apprentice
        interests:
          type: array
          description: A list of interests this resource is related to
          items:
            type: string
            enum:
              - ux
              - api
              - sre
              - data
              - design
              - games
              - iot
              - robot
        technologies:
          type: array
          description: A list of technologies this resource covers
          items:
            type: string
            enum:
              - React
              - MongoDB
              - Python
              - TypeScript
              - Java
              - HTML
              - CSS
              - Other
        last_verified:
          type: string
          format: date-time
          description: When was this resource link last verified
          example: "2024-01-15T10:00:00Z"
        status:
          type: string
          description: Status of the document
          enum:
            - active
            - archived
            - failed
          example: active
        created:
          $ref: '#/components/schemas/Breadcrumb'
        saved:
          $ref: '#/components/schemas/Breadcrumb'

    ResourceAggregation:
      type: object
      description: Resource level rating and note count metrics
      additionalProperties: false
      required:
        - _id
        - resource_id
        - rating_sum
        - created
        - last_saved
      properties:
        _id:
          type: string
          description: A unique identifier for Resource_Aggregation
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011
        resource_id:
          type: string
          description: The Resource that is rated
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011
        note_count:
          type: integer
          minimum: 0
          description: The number of notes left on this resource
          example: 3
        completions:
          type: integer
          minimum: 0
          description: The number of times this resource has been completed
          example: 5
        hits:
          type: integer
          minimum: 0
          description: The number of times this URL has been clicked
          example: 12
        duration:
          type: string
          description: The total duration of all completions (ISO 8601 duration)
          pattern: '^P(?!$)(\d+Y)?(\d+M)?(\d+W)?(\d+D)?(T(\d+H)?(\d+M)?(\d+(\.\d+)?S)?)?$'
          example: PT2H30M
        rating_count:
          type: integer
          minimum: 0
          description: The number of ratings (should equal completions)
          example: 5
        rating_sum:
          type: integer
          minimum: 0
          description: The sum of all ratings
          example: 20
        created:
          $ref: '#/components/schemas/Breadcrumb'
        last_saved:
          $ref: '#/components/schemas/Breadcrumb'

    ResourceDetail:
      type: object
      description: Composite Resource detail view (resource + aggregation + notes)
      additionalProperties: false
      required:
        - resource
        - notes
      properties:
        resource:
          $ref: '#/components/schemas/Resource'
        aggregation:
          nullable: true
          allOf:
